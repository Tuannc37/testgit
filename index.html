<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademark Checker</title>
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            margin-bottom: 20px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        #checkBtn {
            background-color: #28a745;
            color: white;
        }

        #checkBtn:hover {
            background-color: #218838;
        }

        #clearErrorsBtn {
            background-color: #ff7f50;
            color: white;
        }

        #clearErrorsBtn:hover {
            background-color: #ff6347;
        }

        #copyBtn {
            background-color: #007bff;
            color: white;
        }

        #copyBtn:hover {
            background-color: #0056b3;
        }

        #resetBtn {
            background-color: #dc3545;
            color: white;
        }

        #resetBtn:hover {
            background-color: #c82333;
        }

        .result {
            font-size: 16px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            white-space: pre-wrap;
            text-align: left;
            width: 100%;
            margin-top: 20px;
        }

        .success {
            background-color: #28a745;
            color: #fff;
        }

        .error {
            background-color: #dc3545;
            color: #fff;
        }

        .highlight {
            background-color: #ffdddd;
            border: 1px solid #ffcccc;
            padding: 2px;
        }

        .error-details {
            margin-top: 10px;
            font-size: 18px;
            color: #000;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trademark Checker</h1>
    <p>Check if your product name contains any trademarked words.</p>

    <div class="form-group">
        <input type="text" id="productName" placeholder="Enter product name">
    </div>

    <div class="form-group">
        <button id="checkBtn">Check Trademark</button>
        <button id="clearErrorsBtn">Clear Errors</button>
        <button id="copyBtn">Copy</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div id="result" class="result"></div>
    <div id="errorDetails" class="error-details"></div>
</div>

<script>
    const trademarkedWords = [
        "Apple", "Microsoft", "Google", "Facebook", "Instagram", "Twitter", "Amazon",
        "Netflix", "Tesla", "Intel", "Samsung",
        "Disney", "Pixar", "Marvel", "Star Wars", "Warner Bros", "Universal Studios",
        "Nickelodeon", "HBO", "Sony", "Paramount", "DreamWorks",
        "Taylor Swift", "Beyoncé", "Lady Gaga", "Justin Bieber", "Ariana Grande",
        "BTS", "Drake", "Rihanna",
        "Nike", "Adidas", "Puma", "Gucci", "Louis Vuitton", "Prada",
        "Chanel", "Versace", "Dior", "Balenciaga",
        "Coca-Cola", "Pepsi", "McDonald's", "Starbucks", "KFC", "Subway",
        "Nestlé", "Red Bull", "Heineken", "Budweiser",
        "Ferrari", "Lamborghini", "Mercedes-Benz", "BMW", "Toyota",
        "Ford", "Volkswagen", "Porsche", "Audi", "Honda",
        "Walmart", "Target", "IKEA", "H&M", "Zara", "Costco", "Alibaba", "eBay",
        "Visa", "Mastercard", "PayPal", "American Express",
        "JPMorgan Chase", "Goldman Sachs", "HSBC"
    ];

    function checkTrademarks(name, trademarks) {
        const lowerCaseName = name.toLowerCase();
        const foundTrademarks = [];

        trademarks.forEach(trademark => {
            const lowerCaseTrademark = trademark.toLowerCase();
            const parts = lowerCaseTrademark.split(/[\s\-]+/);

            // Check for any part of the trademark appearing anywhere in the input name
            let found = parts.some(part => lowerCaseName.includes(part));
            if (found) {
                foundTrademarks.push(trademark);
            }
        });

        return foundTrademarks;
    }

    function highlightTrademarks(text, trademarks) {
        let highlightedText = text;

        trademarks.forEach(trademark => {
            const regex = new RegExp(`(${trademark.split(/[\s\-]+/).join('|')})`, 'gi');
            highlightedText = highlightedText.replace(regex, '<span class="highlight">$1</span>');
        });

        return highlightedText;
    }

    document.getElementById("checkBtn").addEventListener("click", function () {
        const productName = document.getElementById("productName").value;
        const resultDiv = document.getElementById("result");
        const errorDetailsDiv = document.getElementById("errorDetails");

        const foundTrademarks = checkTrademarks(productName, trademarkedWords);

        if (foundTrademarks.length > 0) {
            resultDiv.innerHTML = `Tên sản phẩm có chứa từ khóa thương hiệu bị bảo hộ: ${foundTrademarks.join(', ')}`;
            resultDiv.className = "result error";
            resultDiv.style.display = "block";
            errorDetailsDiv.innerHTML = `Từ khóa bị lỗi: ${highlightTrademarks(productName, foundTrademarks)}`;
            errorDetailsDiv.style.display = "block";
        } else {
            resultDiv.innerHTML = "Tên sản phẩm không vi phạm thương hiệu.";
            resultDiv.className = "result success";
            resultDiv.style.display = "block";
            errorDetailsDiv.style.display = "none";
        }
    });

    document.getElementById("clearErrorsBtn").addEventListener("click", function () {
        const productName = document.getElementById("productName").value;
        let cleanedText = productName;

        const foundTrademarks = checkTrademarks(productName, trademarkedWords);
        foundTrademarks.forEach(trademark => {
            const regex = new RegExp(`(${trademark.split(/[\s\-]+/).join('|')})`, 'gi');
            cleanedText = cleanedText.replace(regex, '');
        });

        document.getElementById("productName").value = cleanedText.trim();
        document.getElementById("result").innerHTML = "Các từ vi phạn thương hiệu đã được xóa !";
        document.getElementById("result").className = "result success";
        document.getElementById("result").style.display = "block";
        document.getElementById("errorDetails").style.display = "none";
    });

    document.getElementById("copyBtn").addEventListener("click", function () {
        const productName = document.getElementById("productName").value;
        navigator.clipboard.writeText(productName).then(function () {
            alert("Đoạn văn bản đã được sao chép!");
        }).catch(function (error) {
            console.error("Không thể sao chép văn bản: ", error);
        });
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
        document.getElementById("productName").value = "";
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";
        resultDiv.style.display = "none";
        document.getElementById("errorDetails").style.display = "none";
    });
</script>

</body>
</html>
