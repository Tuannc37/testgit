<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trademark Checker</title>
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            margin-bottom: 20px;
            color: #666;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #218838;
        }

        .result {
            font-size: 16px;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #28a745;
        }

        .error {
            background-color: #dc3545;
        }

        .reset-button {
            background-color: #ff7f50;
        }

        .reset-button:hover {
            background-color: #ff6347;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trademark Checker</h1>
    <p>Check if your product name contains any trademarked words.</p>

    <div class="form-group">
        <input type="text" id="productName" placeholder="Enter product name">
        <button id="checkBtn">Check Trademark</button>
        <button id="resetBtn" class="reset-button">Reset</button>
    </div>

    <div id="result" class="result"></div>
</div>

<script>
    // JavaScript code to check trademarks

    const trademarkedWords = [
        // Technology Brands
        "Apple", "Microsoft", "Google", "Facebook", "Instagram", "Twitter", "Amazon",
        "Netflix", "Tesla", "Intel", "Samsung",

        // Entertainment Brands
        "Disney", "Pixar", "Marvel", "Star Wars", "Warner Bros", "Universal Studios",
        "Nickelodeon", "HBO", "Sony", "Paramount", "DreamWorks",

        // Music Artists
        "Taylor Swift", "Beyoncé", "Lady Gaga", "Justin Bieber", "Ariana Grande",
        "BTS", "Drake", "Rihanna",

        // Fashion Brands
        "Nike", "Adidas", "Puma", "Gucci", "Louis Vuitton", "Prada",
        "Chanel", "Versace", "Dior", "Balenciaga",

        // Food & Beverage Brands
        "Coca-Cola", "Pepsi", "McDonald's", "Starbucks", "KFC", "Subway",
        "Nestlé", "Red Bull", "Heineken", "Budweiser",

        // Automotive Brands
        "Ferrari", "Lamborghini", "Mercedes-Benz", "BMW", "Toyota",
        "Ford", "Volkswagen", "Porsche", "Audi", "Honda",

        // Retail Brands
        "Walmart", "Target", "IKEA", "H&M", "Zara", "Costco", "Alibaba", "eBay",

        // Financial Brands
        "Visa", "Mastercard", "PayPal", "American Express",
        "JPMorgan Chase", "Goldman Sachs", "HSBC"
    ];

    function checkTrademark(name, trademarks) {
        const lowerCaseName = name.toLowerCase();

        for (const trademark of trademarks) {
            const lowerCaseTrademark = trademark.toLowerCase();
            
            // Split the trademark into parts (e.g., Coca-Cola -> ["coca", "cola"])
            const parts = lowerCaseTrademark.split(/[\s\-]+/);

            // Check if any part of the trademark is found in the product name
            for (const part of parts) {
                if (lowerCaseName.includes(part)) {
                    return trademark;
                }
            }
        }
        return null;
    }

    document.getElementById("checkBtn").addEventListener("click", function () {
        const productName = document.getElementById("productName").value;
        const resultDiv = document.getElementById("result");

        const foundTrademark = checkTrademark(productName, trademarkedWords);

        if (foundTrademark) {
            resultDiv.textContent = `Tên sản phẩm có chứa từ khóa thương hiệu bị bảo hộ: ${foundTrademark}`;
            resultDiv.className = "result error";
            resultDiv.style.display = "block";
        } else {
            resultDiv.textContent = "Tên sản phẩm không vi phạm thương hiệu.";
            resultDiv.className = "result success";
            resultDiv.style.display = "block";
        }
    });

    // Reset button functionality
    document.getElementById("resetBtn").addEventListener("click", function () {
        document.getElementById("productName").value = "";
        const resultDiv = document.getElementById("result");
        resultDiv.textContent = "";
        resultDiv.style.display = "none";
    });
</script>

</body>
</html>
